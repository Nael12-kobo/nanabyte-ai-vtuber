<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#3d2b8f"/>
    </linearGradient>
    <radialGradient id="cardGrad" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#1a2350"/>
      <stop offset="1" stop-color="#0e1430"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d1226"/>

  <!-- jendela aplikasi -->
  <rect x="40" y="40" width="1200" height="640" rx="20" fill="#121a33" stroke="#243056" stroke-width="2"/>

  <!-- HUD atas -->
  <rect x="64" y="56" width="110" height="40" rx="10" fill="#1b2547"/>
  <text x="80" y="82" font-size="16" fill="#cfd8f7">☰ Menu</text>
  <text x="544" y="78" font-size="20" font-weight="700" fill="#ffffff">Nana AI</text>
  <text x="560" y="96" font-size="13" fill="#8ea2ff">AI Companion</text>
  <rect x="1076" y="58" width="140" height="38" rx="19" fill="#102e22" stroke="#2e7d5b"/>
  <circle cx="1096" cy="77" r="5" fill="#34d399"/>
  <text x="1110" y="82" font-size="14" fill="#7ee2b8">Local AI</text>

  <!-- kartu viewer -->
  <rect x="56" y="116" width="568" height="472" rx="16" fill="url(#cardGrad)" stroke="#2a3560"/>
  <circle cx="285" cy="320" r="200" fill="url(#glow)"/>
  <circle cx="285" cy="330" r="150" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.18"/>
  <circle cx="285" cy="330" r="175" stroke="#b388ff" stroke-width="1.5" fill="none" opacity="0.1"/>

  <!-- chip LIVE -->
  <rect x="76" y="132" width="74" height="26" rx="13" fill="#3a1420" stroke="#7c3348"/>
  <circle cx="92" cy="145" r="4.5" fill="#f0536d"/>
  <text x="102" y="149" font-size="13" font-weight="700" fill="#f69cb0">LIVE</text>

  <!-- karakter Nana (besar) -->
  <g transform="translate(205,120) scale(1.5)">
    <path d="M14 44 Q12 2 60 0 Q108 2 106 44 L106 60 Q106 92 60 92 Q14 92 14 60 Z" fill="#39476f"/>
    <circle cx="60" cy="58" r="34" fill="#ffe3c4"/>
    <path d="M27 50 C27 30 40 22 60 22 C80 22 93 30 93 50 C93 60 80 58 60 58 C40 58 27 60 27 50 Z" fill="#4a5aa8"/>
    <path d="M14 44 Q18 20 34 16 L36 30 Q24 34 22 58 L20 84 Z" fill="#39476f"/>
    <path d="M106 44 Q102 20 86 16 L84 30 Q96 34 98 58 L100 84 Z" fill="#39476f"/>
    <path d="M22 44 Q60 6 98 44" stroke="#7c4dff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="10" fill="#7c4dff"/>
    <circle cx="98" cy="50" r="10" fill="#7c4dff"/>
    <circle cx="22" cy="50" r="4" fill="#b388ff"/>
    <circle cx="98" cy="50" r="4" fill="#b388ff"/>
    <ellipse cx="47" cy="66" rx="4.5" ry="6" fill="#23234d"/>
    <ellipse cx="73" cy="66" rx="4.5" ry="6" fill="#23234d"/>
    <circle cx="49" cy="63" r="1.5" fill="#ffffff"/>
    <circle cx="75" cy="63" r="1.5" fill="#ffffff"/>
    <circle cx="40" cy="73" r="3.5" fill="#ffb3b3" opacity="0.55"/>
    <circle cx="80" cy="73" r="3.5" fill="#ffb3b3" opacity="0.55"/>
    <path d="M54 80 Q60 85 66 80" stroke="#d97a5f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M38 92 Q36 120 26 152 L94 152 Q84 120 82 92 Z" fill="url(#body)"/>
    <path d="M48 90 L60 106 L72 90 Z" fill="#e8edff"/>
  </g>

  <!-- balon chat di atas karakter -->
  <rect x="120" y="150" width="312" height="58" rx="14" fill="#1d2a55" stroke="#33427a"/>
  <path d="M276 208 l10 10 8 -10 z" fill="#1d2a55"/>
  <text x="140" y="178" font-size="15" fill="#e8edff">Halo Nael~ 👋 Mau ngobrol apa?</text>
  <text x="140" y="198" font-size="13" fill="#9fb0e8">Aku dengerin kamu kok 😊</text>

  <!-- kilau -->
  <g fill="#ffe066">
    <path d="M470 150 l2.6 6.5 6.5 2.6 -6.5 2.6 -2.6 6.5 -2.6 -6.5 -6.5 -2.6 6.5 -2.6 z" opacity="0.85"/>
    <path d="M140 520 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 z" opacity="0.7"/>
  </g>
  <text x="478" y="440" font-size="26" fill="#4fc3f7" opacity="0.6">♪</text>
  <text x="120" y="500" font-size="26" fill="#b388ff" opacity="0.6">♫</text>

  <!-- panel chat kanan -->
  <rect x="640" y="116" width="584" height="472" rx="16" fill="#0f1633" stroke="#243056"/>
  <text x="664" y="148" font-size="18" font-weight="700" fill="#ffffff">Chat</text>
  <text x="664" y="168" font-size="13" fill="#8ea2ff">Nana membalas dengan suara natural 💙</text>
  <line x1="664" y1="182" x2="1200" y2="182" stroke="#1d2850" stroke-width="1.5"/>

  <!-- bubble Nana 1 -->
  <circle cx="652" cy="224" r="17" fill="url(#accent)"/>
  <text x="645" y="230" font-size="15" font-weight="700" fill="#0b1026">N</text>
  <rect x="664" y="196" width="392" height="58" rx="14" fill="#1d2a55"/>
  <text x="684" y="220" font-size="14" fill="#e8edff">Halo Nael~ 👋 Aku Nana, AI companion kamu!</text>
  <text x="684" y="240" font-size="13" fill="#9fb0e8">Aku ingat kamu suka warna biru 💙</text>

  <!-- bubble user -->
  <rect x="788" y="280" width="412" height="52" rx="14" fill="#4c3f9e"/>
  <path d="M1200 306 l-10 10 2 -12 z" fill="#4c3f9e"/>
  <text x="812" y="312" font-size="14" fill="#ffffff">Nana, inget aku suka warna biru</text>

  <!-- bubble Nana 2 -->
  <circle cx="652" cy="386" r="17" fill="url(#accent)"/>
  <text x="645" y="392" font-size="15" font-weight="700" fill="#0b1026">N</text>
  <rect x="664" y="358" width="430" height="58" rx="14" fill="#1d2a55"/>
  <text x="684" y="382" font-size="14" fill="#e8edff">Oke, aku ingat ya: kamu suka warna biru 😸</text>
  <text x="684" y="402" font-size="13" fill="#9fb0e8">Aku simpan di memori jangka panjangku</text>

  <!-- mengetik -->
  <circle cx="664" cy="452" r="4" fill="#5b6aa8"/>
  <circle cx="680" cy="452" r="4" fill="#5b6aa8"/>
  <circle cx="696" cy="452" r="4" fill="#5b6aa8"/>
  <text x="710" y="456" font-size="13" fill="#5b6aa8" font-style="italic">Nana lagi mikir…</text>

  <!-- emosi -->
  <g font-size="13" fill="#9fb0e8">
    <rect x="664" y="486" width="92" height="30" rx="15" fill="#1b2547" stroke="#33427a"/>
    <text x="682" y="506">Emosi 😊</text>
    <rect x="766" y="486" width="86" height="30" rx="15" fill="#1b2547" stroke="#33427a"/>
    <text x="782" y="506">Lip-sync</text>
    <rect x="862" y="486" width="100" height="30" rx="15" fill="#1b2547" stroke="#33427a"/>
    <text x="880" y="506">Memory ✓</text>
  </g>

  <!-- composer bawah -->
  <rect x="56" y="600" width="1168" height="56" rx="14" fill="#121a33" stroke="#243056"/>
  <circle cx="96" cy="628" r="18" fill="#1b2547" stroke="#33427a"/>
  <text x="89" y="634" font-size="20" fill="#8ea2ff">＋</text>
  <rect x="126" y="612" width="700" height="32" rx="16" fill="#0b1126" stroke="#223059"/>
  <text x="150" y="633" font-size="14" fill="#5b6aa8">Ketik pesan ke Nana...</text>
  <rect x="844" y="612" width="88" height="32" rx="10" fill="#1b2547"/>
  <text x="864" y="632" font-size="13" fill="#cfd8f7">Riwayat</text>
  <rect x="942" y="612" width="88" height="32" rx="10" fill="#1b2547"/>
  <text x="964" y="632" font-size="13" fill="#cfd8f7">Coding</text>
  <rect x="1040" y="612" width="160" height="32" rx="10" fill="url(#accent)"/>
  <text x="1090" y="632" font-size="14" font-weight="700" fill="#0b1026">Kirim ➤</text>

  <text x="56" y="706" font-size="14" fill="#5b6aa8">Web UI Nana — otomatis jalan di http://localhost:5000</text>
</svg>
