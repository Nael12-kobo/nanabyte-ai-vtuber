<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Segoe UI, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f26"/>
      <stop offset="0.55" stop-color="#161b4a"/>
      <stop offset="1" stop-color="#2a1a63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#3d2b8f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="240" fill="url(#glow)"/>
  <circle cx="120" cy="340" r="280" fill="url(#glow)"/>

  <!-- bintang -->
